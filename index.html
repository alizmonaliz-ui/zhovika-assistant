<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#050505"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>ZHOVIKA — دستیار شخصی</title>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--gold:#C9A84C;--gl:#E8C97A;--gd:#8B6914;--bg:#050505;--bg2:#0a0804;--bg3:#11100c;--bg4:#1a1814;--text:#fff;--text2:rgba(255,255,255,.7);--text3:rgba(255,255,255,.4);--border:rgba(201,168,76,.12);--accent:rgba(201,168,76,.1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);font-family:'Vazirmatn',sans-serif;direction:rtl;color:var(--text);overflow:hidden;-webkit-tap-highlight-color:transparent}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes slideOut{from{transform:translateX(0)}to{transform:translateX(100%)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes ripple{0%{transform:scale(0);opacity:.5}100%{transform:scale(4);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes recording{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(201,168,76,.4)}50%{transform:scale(1.1);box-shadow:0 0 0 10px rgba(201,168,76,0)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(201,168,76,0)}}
.gs{background:linear-gradient(90deg,var(--gd),var(--gl),var(--gold),var(--gl),var(--gd));background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 4s linear infinite}
.btn-gold{background:linear-gradient(135deg,var(--gd),var(--gold),var(--gl));color:#0a0a0a;border:none;cursor:pointer;font-family:'Vazirmatn',sans-serif;font-weight:600;transition:all .25s;display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:.6rem 1.2rem;font-size:.85rem}
.btn-gold:hover{filter:brightness(1.15);transform:translateY(-2px);box-shadow:0 8px 28px rgba(201,168,76,.35)}
.btn-gold:active{transform:translateY(0)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--gl);cursor:pointer;font-family:'Vazirmatn',sans-serif;transition:all .25s;display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:.5rem 1rem;font-size:.8rem}
.btn-outline:hover{border-color:var(--gold);background:var(--accent)}
.btn-icon{width:40px;height:40px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);color:var(--gl);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;font-size:1.1rem}
.btn-icon:hover{background:var(--accent);border-color:var(--gold);transform:scale(1.05)}
.btn-icon:active{transform:scale(.95)}

/* App Shell */
.app{display:flex;height:100vh;flex-direction:column}
.header{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(5,5,5,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:.7rem 1rem;display:flex;align-items:center;justify-content:space-between;height:56px}
.header-title{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:8px}
.header-actions{display:flex;gap:8px;align-items:center}

/* Online Toggle */
.online-toggle{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:100px;padding:3px 12px 3px 3px;cursor:pointer;transition:all .3s}
.online-toggle.online{border-color:var(--gold);background:rgba(201,168,76,.08)}
.online-toggle .dot{width:8px;height:8px;border-radius:50%;background:#444;transition:all .3s}
.online-toggle.online .dot{background:#4CAF50;box-shadow:0 0 8px #4CAF50}
.online-toggle .txt{font-size:.65rem;color:var(--text3);transition:all .3s}
.online-toggle.online .txt{color:var(--gl)}

/* Main Content */
.main-content{flex:1;margin-top:56px;margin-bottom:64px;overflow-y:auto;overflow-x:hidden;padding:1rem;animation:fadeIn .4s ease}
.main-content::-webkit-scrollbar{width:3px}
.main-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(5,5,5,.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 0;padding-bottom:calc(6px + env(safe-area-inset-bottom));height:64px}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;cursor:pointer;transition:all .2s;border-radius:8px;color:var(--text3);font-size:.6rem;position:relative}
.nav-item .icon{font-size:1.3rem;transition:all .2s}
.nav-item.active{color:var(--gold)}
.nav-item.active .icon{transform:translateY(-2px)}
.nav-item:hover{color:var(--gl)}
.nav-badge{position:absolute;top:2px;right:calc(50% - 14px);background:var(--gold);color:#000;font-size:.5rem;font-weight:700;padding:1px 4px;border-radius:100px;min-width:14px;text-align:center}

/* Cards */
.card{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:1rem;animation:fadeIn .4s ease;transition:all .2s}
.card:hover{border-color:rgba(201,168,76,.2)}
.card-title{font-size:.85rem;font-weight:600;color:var(--gl);margin-bottom:.75rem;display:flex;align-items:center;gap:6px}

/* Inputs */
.input{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:.6rem .8rem;color:var(--text);font-family:'Vazirmatn',sans-serif;font-size:.85rem;width:100%;outline:none;transition:all .2s}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.1)}
.input::placeholder{color:var(--text3)}
textarea.input{resize:vertical;min-height:80px}

/* Task Items */
.task-item{display:flex;align-items:center;gap:10px;padding:.7rem .8rem;border-radius:8px;background:var(--bg2);border:1px solid var(--border);margin-bottom:.5rem;cursor:pointer;transition:all .2s}
.task-item:hover{border-color:rgba(201,168,76,.2)}
.task-item.completed{opacity:.5}
.task-item.completed .task-text{text-decoration:line-through;color:var(--text3)}
.task-check{width:20px;height:20px;border:2px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.task-item.completed .task-check{background:var(--gold);border-color:var(--gold)}
.task-text{flex:1;font-size:.82rem}
.task-delete{color:#ff4444;opacity:0;transition:all .2s;font-size:1rem}
.task-item:hover .task-delete{opacity:1}

/* Notes */
.note-card{background:var(--bg4);border:1px solid var(--border);border-radius:10px;padding:.8rem;margin-bottom:.6rem;cursor:pointer;transition:all .2s;position:relative}
.note-card:hover{border-color:rgba(201,168,76,.25);transform:translateY(-2px)}
.note-title{font-size:.82rem;font-weight:600;margin-bottom:.3rem}
.note-preview{font-size:.72rem;color:var(--text3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note-date{font-size:.6rem;color:var(--text3);margin-top:.4rem}

/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-header{font-size:.65rem;color:var(--text3);padding:.3rem}
.cal-day{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:.75rem;cursor:pointer;transition:all .2s;position:relative}
.cal-day:hover{background:var(--accent)}
.cal-day.today{background:var(--gold);color:#000;font-weight:700}
.cal-day.has-event::after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--gold)}
.cal-day.other-month{color:var(--text3);opacity:.4}

/* Budget */
.budget-bar{height:8px;background:var(--bg2);border-radius:4px;overflow:hidden;margin:.5rem 0}
.budget-fill{height:100%;border-radius:4px;transition:width .5s ease;background:linear-gradient(90deg,var(--gd),var(--gold))}
.budget-row{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--border)}
.budget-row:last-child{border-bottom:none}

/* Exercise */
.ex-stat{display:flex;gap:12px;overflow-x:auto;padding-bottom:.5rem}
.ex-stat-item{flex-shrink:0;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:.8rem 1rem;min-width:100px;text-align:center}
.ex-stat-value{font-size:1.2rem;font-weight:700;color:var(--gold)}
.ex-stat-label{font-size:.65rem;color:var(--text3);margin-top:2px}

/* Chat */
.chat-container{display:flex;flex-direction:column;gap:.75rem;padding-bottom:1rem}
.chat-msg{display:flex;gap:8px;max-width:85%;animation:fadeIn .3s ease}
.chat-msg.user{margin-left:auto;flex-direction:row-reverse}
.chat-bubble{padding:.7rem 1rem;border-radius:16px;font-size:.82rem;line-height:1.6;word-break:break-word}
.chat-msg.ai .chat-bubble{background:var(--bg4);border:1px solid var(--border);border-bottom-right-radius:4px}
.chat-msg.user .chat-bubble{background:linear-gradient(135deg,var(--gd),var(--gold));color:#000;border-bottom-left-radius:4px}
.chat-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0}
.chat-msg.ai .chat-avatar{background:var(--bg3);border:1px solid var(--border)}
.chat-msg.user .chat-avatar{background:var(--gold);color:#000}
.chat-input-wrap{position:fixed;bottom:64px;left:0;right:0;padding:.6rem 1rem;background:rgba(5,5,5,.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;z-index:90}
.chat-input-wrap .input{flex:1}

/* Voice Button */
.voice-btn{width:40px;height:40px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);color:var(--gl);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;font-size:1.1rem;flex-shrink:0}
.voice-btn:hover{background:var(--accent);border-color:var(--gold)}
.voice-btn.recording{animation:recording 1.2s infinite;background:var(--gold);color:#000;border-color:var(--gold)}

/* Study */
.study-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:.8rem;margin-bottom:.5rem;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .2s}
.study-card:hover{border-color:rgba(201,168,76,.2)}
.study-progress{width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--gold) var(--deg,0deg),var(--bg4) 0);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.study-progress-inner{width:32px;height:32px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700}

/* Reminders */
.rem-item{display:flex;align-items:center;gap:10px;padding:.6rem .8rem;background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:.5rem}
.rem-time{font-size:.75rem;font-weight:700;color:var(--gold);min-width:45px}
.rem-text{flex:1;font-size:.8rem}
.rem-toggle{width:36px;height:20px;border-radius:10px;background:rgba(255,255,255,.1);position:relative;transition:background .3s;cursor:pointer;flex-shrink:0}
.rem-toggle.on{background:var(--gold)}
.rem-toggle::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:white;top:3px;right:3px;transition:transform .3s}
.rem-toggle.on::after{transform:translateX(-16px)}

/* Instagram / Telegram panels */
.social-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:.6rem}
.social-header{display:flex;align-items:center;gap:10px;margin-bottom:.6rem}
.social-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.ig-icon{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:white}
.tg-icon{background:#2CA5E0;color:white}

/* Modal */
.modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:1rem}
.modal.show{display:flex;animation:fadeIn .2s ease}
.modal-content{background:var(--bg2);border:1px solid var(--border);border-radius:16px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;animation:slideIn .3s ease}
.modal-header{padding:1rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:1rem}
.modal-footer{padding:1rem;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}

/* Toast */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(10,8,4,.95);border:1px solid var(--gold);color:var(--gl);padding:.6rem 1.2rem;border-radius:8px;font-size:.78rem;opacity:0;pointer-events:none;transition:all .3s;z-index:300;box-shadow:0 4px 20px rgba(201,168,76,.2);white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Empty State */
.empty-state{text-align:center;padding:3rem 1rem;color:var(--text3)}
.empty-state .icon{font-size:3rem;margin-bottom:1rem;opacity:.5}
.empty-state p{font-size:.85rem}

/* Scrollbar */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Responsive */
@media(min-width:768px){
  .app{max-width:480px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border)}
}
</style>
</head>
<body>

<div class="app">
  <!-- HEADER -->
  <div class="header">
    <div class="header-title">
      <span style="font-size:1.3rem">🖤</span>
      <span class="gs">ZHOVIKA</span>
    </div>
    <div class="header-actions">
      <div class="online-toggle" id="online-toggle" onclick="toggleOnline()">
        <div class="dot"></div>
        <span class="txt">آفلاین</span>
      </div>
      <button class="btn-icon" onclick="showSettings()">⚙️</button>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content" id="main-content">
    <!-- Dynamic content loaded here -->
  </div>

  <!-- CHAT INPUT (only for chat tab) -->
  <div class="chat-input-wrap" id="chat-input" style="display:none">
    <button class="voice-btn" id="voice-btn" onclick="toggleVoice()">🎤</button>
    <input type="text" class="input" id="chat-text" placeholder="پیام بنویسید..." onkeydown="if(event.key==='Enter')sendChat()"/>
    <button class="btn-gold" style="padding:.5rem 1rem" onclick="sendChat()">⬆️</button>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('home',this)">
      <span class="icon">🏠</span>
      <span>خانه</span>
    </div>
    <div class="nav-item" onclick="switchTab('tasks',this)">
      <span class="icon">✅</span>
      <span>وظایف</span>
      <span class="nav-badge" id="task-badge" style="display:none">0</span>
    </div>
    <div class="nav-item" onclick="switchTab('notes',this)">
      <span class="icon">📝</span>
      <span>یادداشت</span>
    </div>
    <div class="nav-item" onclick="switchTab('chat',this)">
      <span class="icon">🤖</span>
      <span>AI</span>
    </div>
    <div class="nav-item" onclick="switchTab('more',this)">
      <span class="icon">⋮</span>
      <span>بیشتر</span>
    </div>
  </div>
</div>

<!-- MODALS -->
<div class="modal" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-content" id="modal-content"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════
// ZHOVIKA Personal Assistant — Core Engine
// ═══════════════════════════════════════════

// ── IndexedDB Setup ──
const DB_NAME = 'ZHOVIKA_PA';
const DB_VERSION = 1;
let db = null;

function initDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = ()=>reject(req.error);
    req.onsuccess = ()=>{db=req.result;resolve(db);};
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      d.createObjectStore('tasks',{keyPath:'id',autoIncrement:true});
      d.createObjectStore('notes',{keyPath:'id',autoIncrement:true});
      d.createObjectStore('reminders',{keyPath:'id',autoIncrement:true});
      d.createObjectStore('expenses',{keyPath:'id',autoIncrement:true});
      d.createObjectStore('exercises',{keyPath:'id',autoIncrement:true});
      d.createObjectStore('study',{keyPath:'id',autoIncrement:true});
      d.createObjectStore('chat',{keyPath:'id',autoIncrement:true});
      d.createObjectStore('settings',{keyPath:'key'});
    };
  });
}

function dbPut(store,data){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(data).onsuccess=(e)=>res(e.target.result);tx.onerror=()=>rej(tx.error);});}
function dbGetAll(store){return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const data=[];tx.objectStore(store).openCursor().onsuccess=(e)=>{const c=e.target.result;if(c){data.push(c.value);c.continue();}else res(data);};tx.onerror=()=>rej(tx.error);});}
function dbDelete(store,id){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(id).onsuccess=res;tx.onerror=()=>rej(tx.error);});}

// ── State ──
let currentTab = 'home';
let isOnline = false;
let isRecording = false;
let recognition = null;
let currentMonth = new Date();
let userSettings = {name:'',currency:'IRR',theme:'dark'};

// ── Toast ──
function showToast(txt,dur=2500){
  const t=document.getElementById('toast');
  t.textContent=txt;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),dur);
}

// ── Online Toggle ──
function toggleOnline(){
  isOnline=!isOnline;
  const el=document.getElementById('online-toggle');
  el.classList.toggle('online',isOnline);
  el.querySelector('.txt').textContent=isOnline?'آنلاین':'آفلاین';
  showToast(isOnline?'🌐 حالت آنلاین فعال شد':'🔌 حالت آفلاین');
  if(isOnline) syncData();
}

// ── Tab Switching ──
function switchTab(tab,el){
  currentTab=tab;
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  if(el) el.classList.add('active');
  document.getElementById('chat-input').style.display=tab==='chat'?'flex':'none';
  renderTab(tab);
}

function renderTab(tab){
  const main=document.getElementById('main-content');
  main.innerHTML='';
  main.scrollTop=0;
  switch(tab){
    case 'home':renderHome(main);break;
    case 'tasks':renderTasks(main);break;
    case 'notes':renderNotes(main);break;
    case 'chat':renderChat(main);break;
    case 'more':renderMore(main);break;
  }
}

// ═══════════════════════════════════════════
// HOME DASHBOARD
// ═══════════════════════════════════════════
async function renderHome(container){
  const tasks=await dbGetAll('tasks');
  const notes=await dbGetAll('notes');
  const reminders=await dbGetAll('reminders');
  const expenses=await dbGetAll('expenses');
  const today=new Date().toLocaleDateString('fa-IR');
  const todayTasks=tasks.filter(t=>!t.done&&t.date===today).length;
  const totalExp=expenses.reduce((a,e)=>a+(e.amount||0),0);

  container.innerHTML=`
    <div style="margin-bottom:1.5rem">
      <h2 style="font-size:1.1rem;margin-bottom:.3rem">سلام ${userSettings.name||'دوست عزیز'}! 👋</h2>
      <p style="color:var(--text3);font-size:.8rem">${new Date().toLocaleDateString('fa-IR',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</p>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem">
      <div class="card" style="padding:.8rem;text-align:center">
        <div style="font-size:1.5rem;margin-bottom:.3rem">✅</div>
        <div style="font-size:1.2rem;font-weight:700;color:var(--gold)">${todayTasks}</div>
        <div style="font-size:.65rem;color:var(--text3)">وظیفه امروز</div>
      </div>
      <div class="card" style="padding:.8rem;text-align:center">
        <div style="font-size:1.5rem;margin-bottom:.3rem">📝</div>
        <div style="font-size:1.2rem;font-weight:700;color:var(--gold)">${notes.length}</div>
        <div style="font-size:.65rem;color:var(--text3)">یادداشت</div>
      </div>
      <div class="card" style="padding:.8rem;text-align:center">
        <div style="font-size:1.5rem;margin-bottom:.3rem">⏰</div>
        <div style="font-size:1.2rem;font-weight:700;color:var(--gold)">${reminders.filter(r=>r.active).length}</div>
        <div style="font-size:.65rem;color:var(--text3)">یادآوری فعال</div>
      </div>
      <div class="card" style="padding:.8rem;text-align:center">
        <div style="font-size:1.5rem;margin-bottom:.3rem">💰</div>
        <div style="font-size:1.2rem;font-weight:700;color:var(--gold)">${totalExp.toLocaleString('fa-IR')}</div>

function renderMiniCalendar(){
  const now=new Date();
  const year=now.getFullYear(),month=now.getMonth();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const today=now.getDate();
  const days=['ش','ی','د','س','چ','پ','ج'];
  let html='<div class="cal-grid">';
  days.forEach(d=>html+=`<div class="cal-header">${d}</div>`);
  for(let i=0;i<firstDay;i++)html+='<div class="cal-day other-month"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const isToday=d===today;
    html+=`<div class="cal-day ${isToday?'today':''}">${d}</div>`;
  }
  html+='</div>';
  return html;
}

function renderBudgetSummary(expenses){
  const cats={'food':'🍔 غذا','transport':'🚗 حمل‌ونقل','shopping':'🛍️ خرید','bills':'💡 قبوض','other':'📦 سایر'};
  const byCat={};
  expenses.forEach(e=>{byCat[e.category]=(byCat[e.category]||0)+(e.amount||0);});
  const total=Object.values(byCat).reduce((a,b)=>a+b,0);
  if(total===0)return'<div class="empty-state" style="padding:1rem"><span class="icon" style="font-size:2rem">💰</span><p>هنوز هزینه‌ای ثبت نشده</p></div>';
  let html='';
  Object.entries(byCat).forEach(([cat,amount])=>{
    const pct=(amount/total*100).toFixed(0);
    html+=`<div class="budget-row"><span style="font-size:.8rem">${cats[cat]||cat}</span><span style="font-size:.8rem;color:var(--gl)">${amount.toLocaleString('fa-IR')}</span></div>`;
    html+=`<div class="budget-bar"><div class="budget-fill" style="width:${pct}%"></div></div>`;
  });
  return html;
}

function generateAIResponse(text){
  const t=text.toLowerCase();
  if(t.includes('سلام')||t.includes('خوبی'))return'سلام! خوبم، ممنون. شما چطورید؟ چه کاری از دستم برمیاد؟';
  if(t.includes('وظیفه')||t.includes('کار'))return'می‌تونید به بخش وظایف برید و کارهای روزانه‌تون رو مدیریت کنید. امروز چندتا کار دارید؟';
  if(t.includes('بودجه')||t.includes('پول')||t.includes('هزینه'))return'برای مدیریت هزینه‌ها به بخش "بیشتر > بودجه" برید. می‌تونید دسته‌بندی کنید و محدودیت تعیین کنید.';
  if(t.includes('ورزش')||t.includes('تمرین'))return'برنامه ورزشی امروز: ۳۰ دقیقه پیاده‌روی سریع + ۲۰ اسکوات + ۱۵ شنا. آماده‌اید؟';
  if(t.includes('درس')||t.includes('مطالعه'))return'برای مرور درس‌ها به بخش "بیشتر > مطالعه" برید. تکنیک پومودرو رو امتحان کنید: ۲۵ دقیقه تمرکز، ۵ دقیقه استراحت.';
  if(t.includes('یادآوری')||t.includes('الارم'))return'می‌تونید یادآوری جدید بسازید. چه ساعتی و برای چه کاری؟';
  if(t.includes('اینستا')||t.includes('پست'))return'برای مدیریت اینستاگرام به بخش "بیشتر > شبکه‌های اجتماعی" برید. می‌تونید پست و استوری زمان‌بندی کنید.';
  if(t.includes('تلگرام')||t.includes('ربات'))return'ربات تلگرام ZHOVIKA فعاله! می‌تونید ازش برای مدیریت وظایف و دریافت نوتیفیکیشن استفاده کنید.';
  return'متوجه شدم! می‌تونید جزئیات بیشتری بدید یا از منوی پایین بخش مورد نظر رو انتخاب کنید.';
}

function escapeHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function toggleVoice(){
  const btn=document.getElementById('voice-btn');
  if(isRecording){
    stopRecording();
    btn.classList.remove('recording');
    btn.textContent='🎤';
    isRecording=false;
  }else{
    startRecording();
    btn.classList.add('recording');
    btn.textContent='⏹️';
    isRecording=true;
  }
}

function startRecording(){
  if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){
    showToast('❌ مرورگر شما صدا به متن را پشتیبانی نمی‌کند');return;
  }
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SpeechRecognition();
  recognition.lang='fa-IR';
  recognition.continuous=false;
  recognition.interimResults=false;
  recognition.onresult=(e)=>{
    const text=e.results[0][0].transcript;
    document.getElementById('chat-text').value=text;
    showToast('🎤 '+text,2000);
  };
  recognition.onerror=()=>{showToast('❌ خطا در تشخیص صدا');stopRecording();};
  recognition.onend=()=>{if(isRecording)toggleVoice();};
  recognition.start();
  showToast('🎤 در حال گوش دادن...');
}

function stopRecording(){if(recognition){recognition.stop();recognition=null;}}

async function renderCalendar(container){

let pomoTimer=null,pomoTime=25*60,pomoRunning=false;
function startPomodoro(){renderTab('study');}
function togglePomodoro(){
  const btn=document.getElementById('pomo-btn');
  if(pomoRunning){
    clearInterval(pomoTimer);pomoRunning=false;
    btn.textContent='▶️ ادامه';
  }else{
    pomoRunning=true;btn.textContent='⏸️ توقف';
    pomoTimer=setInterval(()=>{
      pomoTime--;updatePomoDisplay();
      if(pomoTime<=0){clearInterval(pomoTimer);pomoRunning=false;showToast('⏱️ پومودورو تمام شد!');btn.textContent='▶️ شروع';pomoTime=25*60;updatePomoDisplay();}
    },1000);
  }
}
function resetPomodoro(){clearInterval(pomoTimer);pomoRunning=false;pomoTime=25*60;updatePomoDisplay();document.getElementById('pomo-btn').textContent='▶️ شروع';}
function updatePomoDisplay(){const m=Math.floor(pomoTime/60),s=pomoTime%60;const el=document.getElementById('pomo-display');if(el)el.textContent=`${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;}

async function renderReminders(container){
  const rems=await dbGetAll('reminders');
  rems.sort((a,b)=>a.time-b.time);
  container.innerHTML=`
    <div style="display:flex;gap:8px;margin-bottom:1rem">
      <button class="btn-gold" style="flex:1;justify-content:center" onclick="showAddReminderModal()">+ یادآوری جدید</button>
    </div>
    <div class="card">
      <div class="card-title">⏰ یادآوری‌ها</div>
      ${rems.length===0?'<div class="empty-state" style="padding:1rem"><span class="icon" style="font-size:2rem">🔔</span><p>هنوز یادآوری ندارید</p></div>':
        rems.map(r=>`
          <div class="rem-item">
            <div class="rem-time">${r.timeStr||'--:--'}</div>
            <div class="rem-text">${r.text}</div>
            <div class="rem-toggle ${r.active?'on':''}" onclick="toggleReminder(${r.id})"></div>
            <span style="cursor:pointer;font-size:1rem" onclick="deleteReminder(${r.id})">🗑️</span>
          </div>
        `).join('')}
    </div>
  `;
}
function showAddReminderModal(){
  showModal('⏰ یادآوری جدید',`
    <input type="text" class="input" id="rem-text" placeholder="متن یادآوری..." style="margin-bottom:.5rem"/>
    <input type="time" class="input" id="rem-time" style="margin-bottom:.5rem"/>
    <select class="input" id="rem-repeat">
      <option value="once">🔁 یک بار</option>
      <option value="daily">📅 هر روز</option>
      <option value="weekly">📆 هفتگی</option>
    </select>
  `,[
    {text:'❌ انصراف',action:closeModal,outline:true},
    {text:'✅ ذخیره',action:async()=>{
      const text=document.getElementById('rem-text').value;
      const timeStr=document.getElementById('rem-time').value;
      const repeat=document.getElementById('rem-repeat').value;
      if(!text||!timeStr){showToast('❌ لطفاً همه فیلدها را پر کنید');return;}
      const [h,m]=timeStr.split(':').map(Number);
      const time=new Date();time.setHours(h,m,0,0);
      await dbPut('reminders',{text,timeStr,time:time.getTime(),repeat,active:true,created:Date.now()});
      closeModal();showToast('⏰ یادآوری تنظیم شد');renderTab('reminders');
      if('Notification' in window&&Notification.permission==='granted'){
        setTimeout(()=>new Notification('ZHOVIKA',{body:text}),time.getTime()-Date.now());
      }
    }}
  ]);
}
async function toggleReminder(id){
  const tx=db.transaction('reminders','readwrite');
  const req=tx.objectStore('reminders').get(id);
  req.onsuccess=async()=>{const r=req.result;r.active=!r.active;await dbPut('reminders',r);renderTab('reminders');};
}
async function deleteReminder(id){await dbDelete('reminders',id);renderTab('reminders');showToast('🗑️ حذف شد');}

        <label style="font-size:.75rem;color:var(--text3);display:block;margin-bottom:4px">داده‌ها</label>
        <button class="btn-outline" style="width:100%;justify-content:center" onclick="exportData()">📤 خروجی JSON</button>
        <button class="btn-outline" style="width:100%;justify-content:center;margin-top:.5rem" onclick="clearAllData()">🗑️ حذف همه داده‌ها</button>
      </div>
      <div style="font-size:.65rem;color:var(--text3);text-align:center;margin-top:.5rem">
        ZHOVIKA Personal Assistant v1.0<br/>
        ساخته شده با 🖤
      </div>
    </div>
  `,[
    {text:'❌ بستن',action:closeModal,outline:true},
    {text:'💾 ذخیره',action:async()=>{
      userSettings.name=document.getElementById('set-name').value;
      userSettings.currency=document.getElementById('set-currency').value;
      await dbPut('settings',{key:'user',value:userSettings});
      closeModal();showToast('💾 تنظیمات ذخیره شد');renderTab('home');
    }}
  ]);
}
function requestNotification(){
  if('Notification' in window){
    Notification.requestPermission().then(p=>{
      if(p==='granted') showToast('🔔 اعلان‌ها فعال شد');
      else showToast('❌ دسترسی رد شد');
    });
  }else showToast('❌ مرورگر پشتیبانی نمی‌کند');
}
async function exportData(){
  const data={};
  for(const store of ['tasks','notes','reminders','expenses','exercises','study','chat']){
    data[store]=await dbGetAll(store);
  }
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='zhovika-backup.json';a.click();
  showToast('📤 خروجی گرفته شد');
}
async function clearAllData(){
  if(!confirm('⚠️ آیا مطمئنید؟ همه داده‌ها حذف می‌شوند!'))return;
  for(const store of ['tasks','notes','reminders','expenses','exercises','study','chat']){
    const tx=db.transaction(store,'readwrite');tx.objectStore(store).clear();
  }
  showToast('🗑️ همه داده‌ها حذف شد');renderTab('home');
}

// ═══════════════════════════════════════════
// MODAL SYSTEM
// ═══════════════════════════════════════════
function showModal(title,bodyHtml,buttons){
  const overlay=document.getElementById('modal-overlay');
  const content=document.getElementById('modal-content');
  content.innerHTML=`
    <div class="modal-header">
      <h3 style="font-size:.9rem;font-weight:700">${title}</h3>
      <button class="btn-icon" style="width:32px;height:32px;font-size:.8rem" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">${bodyHtml}</div>
    <div class="modal-footer">
      ${buttons.map(b=>`<button class="${b.outline?'btn-outline':'btn-gold'}" onclick="(${b.action.toString()})()">${b.text}</button>`).join('')}
    </div>
  `;
  overlay.classList.add('show');
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('show');}

// ═══════════════════════════════════════════
// SYNC (Online Mode)
// ═══════════════════════════════════════════

  if(!isOnline)return;
  showToast('🌐 در حال همگام‌سازی...',1500);

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
async function init(){
  await initDB();
  // Load settings
  const tx=db.transaction('settings','readonly');
  const req=tx.objectStore('settings').get('user');
  req.onsuccess=()=>{if(req.result){userSettings=req.result.value;}};
  renderTab('home');

  // Register service worker
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(e=>console.log('SW failed',e));
  }

  // Request notification
  if('Notification' in window&&Notification.permission==='default'){
    Notification.requestPermission();
  }
}

// Handle tab switching for sub-pages
const originalSwitchTab=switchTab;
switchTab=function(tab,el){
  if(tab==='calendar'){currentTab='calendar';document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));renderCalendar(document.getElementById('main-content'));return;}
  if(tab==='budget'){currentTab='budget';document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));renderBudget(document.getElementById('main-content'));return;}
  if(tab==='exercise'){currentTab='exercise';document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));renderExercise(document.getElementById('main-content'));return;}
  if(tab==='study'){currentTab='study';document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));renderStudy(document.getElementById('main-content'));return;}
  if(tab==='reminders'){currentTab='reminders';document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));renderReminders(document.getElementById('main-content'));return;}
  if(tab==='social'){currentTab='social';document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));renderSocial(document.getElementById('main-content'));return;}
  originalSwitchTab(tab,el);
};

init();
</script>
